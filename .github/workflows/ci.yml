name: ci

on:
  push:
  pull_request:

jobs:
  skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        timeout-minutes: 5
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project (populates .godot/ on a fresh checkout)
        timeout-minutes: 5
        run: godot --headless --path . --import

      - name: Parse all GDScript (--check-only, no execution)
        timeout-minutes: 5
        run: |
          for f in $(find . -path ./.godot -prune -o -name '*.gd' -print); do godot --headless --path . --check-only --script "res://${f#.}"; done

      - name: Run GDScript unit tests
        timeout-minutes: 5
        run: |
          godot --headless --path . --script res://tests/test_serve_logic.gd
          godot --headless --path . --script res://tests/test_flop_logic.gd
          godot --headless --path . --script res://tests/test_grab_logic.gd
          godot --headless --path . --script res://tests/test_scaffold_logic.gd
          godot --headless --path . --script res://tests/test_net_logic.gd
          godot --headless --path . --script res://tests/test_sfx_logic.gd
          godot --headless --path . --script res://tests/test_props_logic.gd
          godot --headless --path . --script res://tests/test_rooms_logic.gd
          godot --headless --path . --script res://tests/test_flow_logic.gd
          godot --headless --path . --script res://tests/test_resilience_logic.gd
          godot --headless --path . --script res://tests/test_stages12_logic.gd
          godot --headless --path . --script res://tests/test_stages34_logic.gd
          godot --headless --path . --script res://tests/test_stages56_logic.gd
          godot --headless --path . --script res://tests/test_ui_logic.gd
          godot --headless --path . --script res://tests/test_stages78_logic.gd
          godot --headless --path . --script res://tests/test_persist_logic.gd
          godot --headless --path . --script res://tests/test_wardrobe_logic.gd
          godot --headless --path . --script res://tests/test_audiovisual_logic.gd
          godot --headless --path . --script res://tests/test_export_logic.gd
          godot --headless --path . --script res://tests/test_desktop_logic.gd
          godot --headless --path . --script res://tests/test_config_logic.gd
          godot --headless --path . --script res://tests/test_full_world_logic.gd
          godot --headless --path . -- --selftest audiovisual
          godot --headless --path . -- --selftest perf

      - name: Web export check (parse-level, no templates)
        timeout-minutes: 5
        run: |
          godot --headless --path . -- --export-check web > /tmp/export_web.log 2>&1
          cat /tmp/export_web.log
          grep -q 'EXPORT_WEB_OK preset=1 headers=1' /tmp/export_web.log

      - name: Desktop preset check (parse-level, no templates)
        timeout-minutes: 5
        run: |
          godot --headless --path . -- --selftest desktop_preset > /tmp/desktop_preset.log 2>&1
          cat /tmp/desktop_preset.log
          grep -q 'DESKTOP_OK preset=1' /tmp/desktop_preset.log

      - name: Full-world probe (2-bot w1s1..w1s8 sweep, no sockets)
        timeout-minutes: 5
        run: |
          godot --headless --path . -- --selftest full_world > /tmp/full_world_probe.log 2>&1
          cat /tmp/full_world_probe.log
          grep -q 'FULL_WORLD_OK stages=8 coins=1 wardrobe=1 persist=1' /tmp/full_world_probe.log

      - name: Config selftest (parse-level, no sockets)
        timeout-minutes: 5
        run: |
          godot --headless --path . -- --selftest config --port 9419 --data-dir /tmp/together_cfg_probe --max-rooms 7 > /tmp/config_probe.log 2>&1
          cat /tmp/config_probe.log
          grep -q 'CONFIG_OK port=1 data_dir=1 max_rooms=1' /tmp/config_probe.log

      - name: Deploy dry-run, unit file, and ops doc
        timeout-minutes: 5
        run: |
          test -x deploy.sh
          ./deploy.sh --dry-run > /tmp/deploy_dry_run.log 2>&1
          cat /tmp/deploy_dry_run.log
          grep -q 'DRY_RUN_OK' /tmp/deploy_dry_run.log
          grep -q 'BUILD_OK' /tmp/deploy_dry_run.log
          grep -q 'UPLOAD_OK' /tmp/deploy_dry_run.log
          grep -q 'RESTART_OK' /tmp/deploy_dry_run.log
          grep -q 'Restart=always' deploy/systemd/together.service
          grep -q 'WantedBy=multi-user.target' deploy/systemd/together.service
          grep -q './deploy server' docs/ops.md

      - name: Compose stack validation
        timeout-minutes: 5
        run: |
          docker compose version
          docker compose config > /tmp/compose_config.log 2>&1
          cat /tmp/compose_config.log
          grep -qF '${PORT:-8080}:8080' docker-compose.yml
          grep -q 'unless-stopped' docker-compose.yml
          grep -q 'cloudflare/cloudflared:latest' docker-compose.yml
          grep -q 'tunnel --no-autoupdate run --token' docker-compose.yml
          grep -q 'tunnel' docker-compose.yml
          TUNNEL_TOKEN=probe docker compose --profile tunnel config > /tmp/compose_tunnel.log 2>&1
          cat /tmp/compose_tunnel.log
          grep -q 'cloudflared' /tmp/compose_tunnel.log

      - name: Skeleton health probe (GET / expects 200)
        timeout-minutes: 5
        run: |
          PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          godot --headless --path . -- --serve --port "$PORT" > /tmp/health_probe.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for _i in $(seq 1 150); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 0.2
          done
          CODE="$(curl -s -o /tmp/health_body.json -w '%{http_code}' "http://127.0.0.1:${PORT}/")"
          if [ "$CODE" != "200" ]; then echo "GET / expected 200, got $CODE"; cat /tmp/health_probe.log; exit 1; fi
          python3 -c 'import json; b = json.load(open("/tmp/health_body.json")); assert b.get("ok") is True, b; assert "version" in b, b; print("GET / 200 ok:", b)'

      - name: Black-box smoke test
        timeout-minutes: 10
        run: bash tests/smoke_serve.sh

      - name: Compose smoke test
        timeout-minutes: 15
        run: bash tests/smoke_compose.sh
