; World 1 manifest (issues #13-14): stage catalog for the onboarding corridor.
; Godot ConfigFile INI. [world1] lists the stage ids in play order; each
; [w1sN] section carries the scene path, the 2/3/4-player scaling tuning,
; and the gate requirement. Scaling tunes hold/order/boost timing and
; platform width only and never lowers the headcount that opens the
; cooperation gates.

[world1]
stages=["w1s1", "w1s2", "w1s3", "w1s4", "w1s5", "w1s6"]

[w1s1]
scene="res://stages/world1/stage_01.tscn"
solo=true
hold_required=0
scaling_2="platform_width=4.0,hold_ms=0"
scaling_3="platform_width=4.5,hold_ms=0"
scaling_4="platform_width=5.0,hold_ms=0"

[w1s2]
scene="res://stages/world1/stage_02.tscn"
solo=false
hold_required=2
scaling_2="platform_width=3.0,hold_ms=1500"
scaling_3="platform_width=3.5,hold_ms=2000"
scaling_4="platform_width=4.0,hold_ms=2500"

[w1s3]
scene="res://stages/world1/stage_03.tscn"
solo=false
order="0,1,2"
scaling_2="platform_width=3.0,order_ms=1500"
scaling_3="platform_width=3.5,order_ms=2000"
scaling_4="platform_width=4.0,order_ms=2500"

[w1s4]
scene="res://stages/world1/stage_04.tscn"
solo=false
gap_width=12.0
cross_required=2
scaling_2="platform_width=3.0,boost_ms=1500"
scaling_3="platform_width=3.5,boost_ms=2000"
scaling_4="platform_width=4.0,boost_ms=2500"

[w1s5]
scene="res://stages/world1/stage_05.tscn"
solo=false
weight_required=2
scaling_2="platform_width=3.0,weight_ms=1500"
scaling_3="platform_width=3.5,weight_ms=2000"
scaling_4="platform_width=4.0,weight_ms=2500"

[w1s6]
scene="res://stages/world1/stage_06.tscn"
solo=false
gap_width=12.0
carry_required=2
scaling_2="platform_width=3.0,relay_ms=1500"
scaling_3="platform_width=3.5,relay_ms=2000"
scaling_4="platform_width=4.0,relay_ms=2500"
