; export_presets.cfg — scaffold placeholder for the Together Godot 4.7 project.
; This file intentionally contains zero [preset.N] blocks.
; Real Windows Desktop / Web export presets are created via Project > Export
; in the release-engineering lap, so nothing here can drift from the
; editor-generated INI format the exporter actually reads.
; It exists only to pin the path (`res://export_presets.cfg`) early and to
; prove `godot --headless --path . --import` tolerates a preset-free file.
